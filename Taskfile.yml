version: '3'

vars:
  BINARY: tapper
  MAIN: ./cmd/tapper
  OUT_DIR: bin

tasks:
  default:
    desc: Build the binary
    cmds:
      - task: build

  build:
    desc: Build the tapper binary
    cmds:
      - mkdir -p {{.OUT_DIR}}
      - go build -trimpath -ldflags="-s -w" -o {{.OUT_DIR}}/{{.BINARY}} {{.MAIN}}
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.OUT_DIR}}/{{.BINARY}}'

  run:
    desc: Run the game
    cmds:
      - go run {{.MAIN}}

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  check:
    desc: Format, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.OUT_DIR}} coverage.out
